[package]
name = "prisma-desktop"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prisma_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol as a default (not a Cargo default-feature list -- just
# enabled directly here) so a plain `cargo build`/`cargo run` reports
# tauri::is_dev() == false, same as a real `cargo tauri build`. Both
# `cargo tauri dev` (--no-default-features + explicit filter) and
# `cargo tauri build` (always pushes tauri/custom-protocol) override
# feature selection at invocation time regardless of what's set here --
# this only affects invoking cargo directly, without the tauri-cli wrapper.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# Sync engine: HTTP client (push, login), WS client (server->desktop push
# notifications), fs watcher (local vault changes), client-id generation.
# All background work is spawned via tauri::async_runtime::spawn onto
# Tauri's own existing tokio runtime rather than a second competing one —
# `tokio` itself is still a direct dep (just "time" for reconnect-delay
# sleeps) since importing any tokio item requires an explicit Cargo edge,
# but nothing here ever constructs a tokio::runtime::Runtime itself.
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "macros", "sync"] }
# default-features carries no TLS backend at all -- every wss:// connect
# attempt failed with "TLS support not compiled in" and silently retried
# forever (confirmed live 2026-07-26: this has been broken since the
# vault-sync feature's very first commit, invisible until now because the
# HTTP push/pull calls use reqwest, which does have a default TLS backend,
# so those always worked and masked the WS channel being fully non-functional
# against any TLS server this whole time). native-tls to match reqwest's own
# default backend rather than adding a second TLS stack (rustls) alongside it.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
notify = "7"
notify-debouncer-full = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
# Content-hash check before pushing (see sync/mod.rs's TrackedFile::content_hash)
# -- the fs watcher firing is not proof content actually changed; the KG/Chroma
# indexers already learned this lesson (see prisma's knowledge_graph_service.py
# _indexed_hash/_set_indexed_hash) but the sync engine never got the same
# treatment, so a spurious/duplicate watcher event pushed identical content
# over and over with nothing to catch it.
sha2 = "0.10"
jsonschema = "0.49.5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0" }
gdk = "0.18"

