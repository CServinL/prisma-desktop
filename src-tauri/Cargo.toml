[package]
name = "prisma-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prisma_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
# Sync engine: HTTP client (push, login), WS client (server->desktop push
# notifications), fs watcher (local vault changes), client-id generation.
# All background work is spawned via tauri::async_runtime::spawn onto
# Tauri's own existing tokio runtime rather than a second competing one —
# `tokio` itself is still a direct dep (just "time" for reconnect-delay
# sleeps) since importing any tokio item requires an explicit Cargo edge,
# but nothing here ever constructs a tokio::runtime::Runtime itself.
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
notify = "7"
notify-debouncer-full = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0" }
gdk = "0.18"

