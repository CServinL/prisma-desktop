<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Prisma</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #0d1320;
    color: #e8edf8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .box {
    max-width: 420px;
    padding: 32px;
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; color: #8ba3c0; margin: 0 0 20px; }
  .field { text-align: left; margin-bottom: 10px; }
  label { display: block; font-size: 11px; color: #8ba3c0; margin-bottom: 3px; }
  input[type="text"], input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    background: #0d1420;
    border: 1px solid #1a2d4a;
    border-radius: 5px;
    color: #e8edf8;
    font-size: 13px;
  }
  .ports { display: flex; gap: 10px; }
  .ports .field { flex: 1; }
  .tls-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .tls-row input { width: auto; }
  .tls-row label { margin-bottom: 0; }
  button {
    width: 100%;
    padding: 9px;
    background: #4a9eff;
    border: none;
    border-radius: 5px;
    color: #0d1320;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { font-size: 11px; color: #f87171; margin-top: 10px; min-height: 14px; }
</style>
</head>
<body>
  <div class="box">
    <h1 id="heading">Prisma server is not running</h1>
    <p id="message">Could not connect to <code id="current-target"></code>. Check the server details or make sure it's running.</p>

    <div class="field" id="hostname-field">
      <label for="hostname">Hostname</label>
      <input id="hostname" type="text" />
    </div>

    <div class="tls-row" id="tls-row">
      <input id="tls" type="checkbox" />
      <label for="tls">TLS / SSL (https)</label>
    </div>

    <div class="ports" id="ports-row">
      <div class="field">
        <label for="api-port">API port</label>
        <input id="api-port" type="number" min="1" max="65535" />
      </div>
      <div class="field">
        <label for="web-port">Web port</label>
        <input id="web-port" type="number" min="1" max="65535" />
      </div>
    </div>

    <div class="field" id="password-field" style="display: none;">
      <label for="password">Password</label>
      <input id="password" type="password" autofocus />
    </div>

    <button id="connect-btn">Connect</button>
    <div id="status"></div>
  </div>
  <script>
    const invoke = window.__TAURI__.core.invoke;

    const hostnameInput = document.getElementById("hostname");
    const tlsInput = document.getElementById("tls");
    const apiPortInput = document.getElementById("api-port");
    const webPortInput = document.getElementById("web-port");
    const passwordInput = document.getElementById("password");

    hostnameInput.value = "{{HOSTNAME}}";
    tlsInput.checked = {{TLS_CHECKED_BOOL}};
    apiPortInput.value = "{{API_PORT}}";
    webPortInput.value = "{{WEB_PORT}}";

    // A dead-session landing (server reachable, /auth/refresh rejected the
    // stored token -- see resolve_start_url in window.rs) reuses this same
    // page but needs a password, not a different host/port -- the hostname
    // fields are already correct and shouldn't invite editing them.
    const needsLogin = {{NEEDS_LOGIN_BOOL}};
    if (needsLogin) {
      document.getElementById("heading").textContent = "Session expired";
      document.getElementById("message").textContent =
        "The server is still running, but the saved session is no longer valid. Enter the password again.";
      document.getElementById("hostname-field").style.display = "none";
      document.getElementById("tls-row").style.display = "none";
      document.getElementById("ports-row").style.display = "none";
      document.getElementById("password-field").style.display = "block";
      passwordInput.focus();
    } else {
      document.getElementById("current-target").textContent =
        `${hostnameInput.value}:${apiPortInput.value}`;
    }

    const btn = document.getElementById("connect-btn");
    const status = document.getElementById("status");

    btn.addEventListener("click", async () => {
      const hostname = hostnameInput.value.trim();
      if (!hostname) return;
      const tls = tlsInput.checked;
      const apiPort = parseInt(apiPortInput.value, 10);
      const webPort = parseInt(webPortInput.value, 10);
      if (!apiPort || !webPort) return;
      const password = passwordInput.value || null;
      if (needsLogin && !password) return;

      btn.disabled = true;
      status.textContent = needsLogin ? "Signing in…" : "Connecting…";
      try {
        const ok = await invoke("try_connect", { hostname, tls, apiPort, webPort, password });
        if (!ok) {
          status.textContent = "Could not connect to that server.";
          btn.disabled = false;
        }
        // On success the Rust side navigates this window away itself --
        // nothing left to do here.
      } catch (e) {
        status.textContent = "Error: " + e;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
