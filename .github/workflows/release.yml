name: Release

# Each target platform is its own independent job, not a matrix or a
# dropdown choice -- flip one on by deleting its `if: false` once you
# actually have hardware/a runner to build it on, without touching the
# others. Only Linux x86_64 is real today. WSL2 support existed as a
# stopgap through 2026-07-30 and was then dropped outright (no Windows/WSL2
# hardware to test against) -- this is a native Linux app now. A genuinely
# native Windows build is planned but not started; macOS is planned once
# Apple Silicon hardware is available (also needed for the one-time
# `tauri ios init`-style bootstrap this repo's iOS work would eventually
# need, per the now-removed ios.yml's own note).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Prisma Desktop ${{ inputs.tag }} (linux-x86_64)"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false

  # Disabled: no ARM Linux hardware to build on yet. Runner label as of
  # 2026-07 is ubuntu-22.04-arm/ubuntu-24.04-arm -- verify it's still
  # correct (GitHub's hosted-ARM-runner naming has changed before) when
  # enabling this.
  release-linux-arm64:
    if: false
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Prisma Desktop ${{ inputs.tag }} (linux-arm64)"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-unknown-linux-gnu

  # Disabled: no native Windows build exists yet -- this is new work, not
  # a port of the Linux binary (WSL2 support, which this would have ported
  # from, was dropped 2026-07-30).
  release-windows-x86_64:
    if: false
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Prisma Desktop ${{ inputs.tag }} (windows-x86_64)"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false

  # Disabled: same as release-windows-x86_64, plus GitHub's hosted
  # Windows-ARM runner (windows-11-arm as of 2026-07) may still be limited
  # availability -- verify when enabling.
  release-windows-arm64:
    if: false
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Prisma Desktop ${{ inputs.tag }} (windows-arm64)"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-pc-windows-msvc

  # Disabled until Apple Silicon hardware is available.
  release-macos-arm64:
    if: false
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Prisma Desktop ${{ inputs.tag }} (macos-arm64)"
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
