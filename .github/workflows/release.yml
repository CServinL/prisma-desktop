name: Release

# Two stages per platform, not one: `build-*` compiles and uploads the
# bundle as a workflow artifact (no GitHub Release interaction at all --
# tauri-action skips all release handling when tagName/releaseName/releaseId
# are omitted). A single `publish` job, gated on every build job, downloads
# every artifact and creates the actual GitHub Release in one place. If
# publish fails (e.g. a permissions issue), `gh run rerun --failed` re-runs
# just that job and reuses every build's already-uploaded output -- no
# multi-minute Rust recompile just because the cheap last step broke.
#
# Each target platform is its own independent job, not a matrix or a
# dropdown choice -- flip one on by deleting its `if: false` once you
# actually have hardware/a runner to build it on, without touching the
# others. Only Linux x86_64 is real today. WSL2 support existed as a
# stopgap through 2026-07-30 and was then dropped outright (no Windows/WSL2
# hardware to test against) -- this is a native Linux app now. A genuinely
# native Windows build is planned but not started; macOS is planned once
# Apple Silicon hardware is available (also needed for the one-time
# `tauri ios init`-style bootstrap this repo's iOS work would eventually
# need, per the now-removed ios.yml's own note).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # No tagName/releaseName/releaseId -- build only, no release touched.
      - uses: tauri-apps/tauri-action@v0

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Disabled: no ARM Linux hardware to build on yet. Runner label as of
  # 2026-07 is ubuntu-22.04-arm/ubuntu-24.04-arm -- verify it's still
  # correct (GitHub's hosted-ARM-runner naming has changed before) when
  # enabling this.
  build-linux-arm64:
    if: false
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Disabled: no native Windows build exists yet -- this is new work, not
  # a port of the Linux binary (WSL2 support, which this would have ported
  # from, was dropped 2026-07-30).
  build-windows-x86_64:
    if: false
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Disabled: same as build-windows-x86_64, plus GitHub's hosted
  # Windows-ARM runner (windows-11-arm as of 2026-07) may still be limited
  # availability -- verify when enabling.
  build-windows-arm64:
    if: false
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Disabled until Apple Silicon hardware is available.
  build-macos-arm64:
    if: false
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs:
      - build-linux-x86_64
      # Disabled build jobs above aren't listed here -- `needs` on a
      # skipped/disabled job blocks the whole workflow. Add each one back
      # here as it's turned on.
    runs-on: ubuntu-22.04
    permissions:
      # tauri-action's build-only jobs above never touch this -- only this
      # job needs write access, and only for creating the Release itself.
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Prisma Desktop ${{ inputs.tag }}"
          body: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: true
          prerelease: false
          files: dist/*/*
